name: Build Android Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: code/app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail

          pubspec_version=$(grep -E '^version:\s*' pubspec.yaml | head -n1 | sed -E 's/version:\s*//')
          if [ -z "${pubspec_version}" ]; then
            echo "Could not find version in code/app/pubspec.yaml" >&2
            exit 1
          fi

          public_version="${pubspec_version%%+*}"
          echo "CALCULATRIX_PUBLIC_VERSION=${public_version}" >> "$GITHUB_ENV"

          if [ "${{ github.event_name }}" = "release" ]; then
            release_tag="${{ github.event.release.tag_name }}"
            normalized_tag="${release_tag#v}"

            if [ "${normalized_tag}" != "${public_version}" ]; then
              echo "Release tag '${release_tag}' does not match pubspec public version '${public_version}'." >&2
              exit 1
            fi
          fi

      - name: Install app dependencies
        run: flutter pub get

      - name: Materialize Android signing files
        shell: bash
        working-directory: code/app/android
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -n "${ANDROID_UPLOAD_KEYSTORE_BASE64}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD}" ] && [ -n "${ANDROID_KEY_ALIAS}" ] && [ -n "${ANDROID_KEY_PASSWORD}" ]; then
            mkdir -p keystore
            echo "${ANDROID_UPLOAD_KEYSTORE_BASE64}" | base64 --decode > keystore/upload-keystore.jks

            printf 'storePassword=%s\n' "${ANDROID_KEYSTORE_PASSWORD}" > key.properties
            printf 'keyPassword=%s\n' "${ANDROID_KEY_PASSWORD}" >> key.properties
            printf 'keyAlias=%s\n' "${ANDROID_KEY_ALIAS}" >> key.properties
            printf 'storeFile=../keystore/upload-keystore.jks\n' >> key.properties

            echo "ANDROID_RELEASE_SIGNING_READY=true" >> "$GITHUB_ENV"
          else
            echo "ANDROID_RELEASE_SIGNING_READY=false" >> "$GITHUB_ENV"
            echo "Signing secrets were not fully provided; build will use debug fallback unless this is a release event."
          fi

      - name: Enforce release signing for published releases
        if: github.event_name == 'release'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${ANDROID_RELEASE_SIGNING_READY}" != "true" ]; then
            echo "::error::Missing Android signing secrets. Configure ANDROID_UPLOAD_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD."
            exit 1
          fi

      - name: Build Android App Bundle
        run: flutter build appbundle --release

      - name: Prepare release artifact
        shell: bash
        run: |
          set -euo pipefail
          out_dir="${RUNNER_TEMP}/android-release"
          mkdir -p "${out_dir}"

          src="build/app/outputs/bundle/release/app-release.aab"
          dst="${out_dir}/Calculatrix-android-${CALCULATRIX_PUBLIC_VERSION}.aab"

          cp "${src}" "${dst}"
          sha256sum "${dst}" > "${out_dir}/SHA256SUMS-android.txt"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-assets
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/android-release/*.aab
            ${{ runner.temp }}/android-release/SHA256SUMS-android.txt

      - name: Upload assets to published release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${{ github.event.release.tag_name }}" \
            "${RUNNER_TEMP}/android-release/Calculatrix-android-${CALCULATRIX_PUBLIC_VERSION}.aab" \
            "${RUNNER_TEMP}/android-release/SHA256SUMS-android.txt" \
            --clobber
