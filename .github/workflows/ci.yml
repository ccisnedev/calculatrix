name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

  # Core tests, with the differential tests against Giac.
  # Giac judges the exact results only; it is never shipped.
  # The job takes under a minute; the timeouts stop a stalled apt-get from
  # holding the runner for the default six hours.
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: code/core
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install Giac
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xcas

      - run: dart pub get

      - run: dart analyze

      - run: dart test
        env:
          CALCULATRIX_REQUIRE_GIAC: '1'

  # CLI tests, so a pull request that breaks `cx` fails here and not at
  # release time. The CLI reads the core by path, so this checkout tests
  # both together.
  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: code/cli
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - run: dart pub get

      - run: dart analyze

      - run: dart test

  build-web:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: code/app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - run: flutter build web --release

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: code/app/build/web
