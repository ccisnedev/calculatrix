name: calculatrix_cli
description: Command-line interface for Calculatrix.
version: 0.16.0
publish_to: 'none'

# The executable is `cx`, built from bin/cx.dart, with no alias of any kind
# (issue #22). `dart compile exe` (scripts/dev-install.ps1) does not read
# this, but a `dart pub global activate` install would, so it is declared
# here too.
executables:
  cx: cx

environment:
  sdk: ^3.8.1

dependencies:
  calculatrix:
    path: ../core
  cli_router: ^0.2.1
  modular_cli_sdk: ^0.9.0
  path: ^1.9.1

dev_dependencies:
  lints: ^5.0.0
  test: ^1.24.0
