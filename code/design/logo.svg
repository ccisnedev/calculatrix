<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Calculatrix logo</title>
  <desc id="desc">A compact calculator mark built around a 2 by 2 identity matrix.</desc>

  <defs>
    <linearGradient id="case" x1="42" y1="22" x2="214" y2="234" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#273449"/>
      <stop offset="1" stop-color="#101722"/>
    </linearGradient>
    <linearGradient id="screen" x1="58" y1="46" x2="198" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#eef7f2"/>
      <stop offset="1" stop-color="#b9d5c5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect x="34" y="22" width="188" height="212" rx="26" fill="url(#case)" filter="url(#shadow)"/>
  <rect x="52" y="42" width="152" height="152" rx="18" fill="url(#screen)"/>
  <rect x="62" y="52" width="132" height="132" rx="12" fill="none" stroke="#273449" stroke-opacity="0.18" stroke-width="3"/>

  <path d="M78 74H66v108h12" fill="none" stroke="#101722" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M178 74h12v108h-12" fill="none" stroke="#101722" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <line x1="128" y1="66" x2="128" y2="170" stroke="#273449" stroke-opacity="0.18" stroke-width="3"/>
  <line x1="76" y1="118" x2="180" y2="118" stroke="#273449" stroke-opacity="0.18" stroke-width="3"/>

  <rect x="84" y="74" width="38" height="38" rx="9" fill="#f36f45"/>
  <rect x="134" y="124" width="38" height="38" rx="9" fill="#f36f45"/>
  <circle cx="153" cy="93" r="8" fill="#273449" fill-opacity="0.34"/>
  <circle cx="103" cy="143" r="8" fill="#273449" fill-opacity="0.34"/>

  <path d="M99 84v18" stroke="#fff8ef" stroke-width="8" stroke-linecap="round"/>
  <path d="M149 134v18" stroke="#fff8ef" stroke-width="8" stroke-linecap="round"/>

  <rect x="68" y="207" width="28" height="12" rx="6" fill="#f36f45"/>
  <rect x="108" y="207" width="28" height="12" rx="6" fill="#d6dee9"/>
  <rect x="148" y="207" width="40" height="12" rx="6" fill="#d6dee9"/>
</svg>
